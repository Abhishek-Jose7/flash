<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07060b">
  <title>Spider-Verse Flashmob | Stage Arena</title>
  <link rel="stylesheet" href="/css/spiderverse.css">
  <style>
    body {
      overflow: hidden;
    }
    .stage-arena-grid {
      display: grid;
      grid-template-columns: 360px 1fr 360px;
      gap: 16px;
      height: calc(100vh - 100px);
      align-items: stretch;
    }
    .spider-box {
      background: var(--bg-card);
      border: 3px solid #28203c;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .spider-box.miles {
      border-color: var(--miles-red);
      box-shadow: 0 0 35px var(--miles-red-glow);
    }
    .spider-box.gwen {
      border-color: var(--gwen-pink);
      box-shadow: 0 0 35px var(--gwen-pink-glow);
    }
    .center-stage-box {
      background: var(--bg-card);
      border: 3px solid #ffcc00;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 204, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="halftone-bg"></div>
  <div class="vignette-overlay"></div>

  <div class="stage-container">
    <!-- Top Header Bar -->
    <header class="status-bar" style="margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="chromatic-text" style="font-size: 24px;">SPIDER-VERSE FLASHMOB</span>
        <span style="font-size: 13px; background: rgba(0,240,255,0.15); color: var(--miles-cyan); padding: 3px 10px; border-radius: 6px; font-weight: 700;">
          STAGE PROJECTOR VIEW
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="font-family: var(--font-comic); font-size: 18px; color: #00ff66;">
          ⚡ <span id="stage-crowd-count">0</span> WEB-SLINGERS CONNECTED
        </div>
        <button id="stage-sound-toggle" class="spider-btn" style="width: auto; padding: 6px 16px; font-size: 14px;">
          🔊 SOUND ON
        </button>
        <span id="stage-conn-tag" style="font-size: 12px; font-weight: 700; color: #00ff66;">ONLINE</span>
      </div>
    </header>

    <!-- Main Dual Spider Arena -->
    <main class="stage-arena-grid">
      <!-- TEAM MILES SPIDER -->
      <section class="spider-box miles">
        <div style="text-align: center; margin-bottom: 8px;">
          <h2 class="chromatic-text" style="font-size: 24px; color: var(--miles-red); margin-bottom: 4px;">
            TEAM MILES
          </h2>
          <div style="display: flex; justify-content: space-around; font-size: 13px; color: #ccc; margin-bottom: 8px;">
            <span id="miles-players-display">0 PLAYERS</span>
            <span id="miles-score-display" style="font-family: var(--font-comic); font-size: 18px; color: #ffd700;">0 PTS</span>
          </div>
          <div class="progress-bar-track" style="height: 10px;">
            <div id="miles-stage-bar" class="progress-bar-fill" style="background: var(--miles-red); width: 0%;"></div>
          </div>
          <div id="miles-pct-display" style="font-family: var(--font-comic); font-size: 18px; color: var(--miles-red); margin-top: 4px;">
            0%
          </div>
        </div>

        <div style="flex: 1; position: relative;">
          <canvas id="stage-canvas-miles" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
      </section>

      <!-- CENTER ARENA (QUESTIONS / COUNTDOWN / PODIUM) -->
      <section id="stage-center-content" class="center-stage-box">
        <!-- Dynamically managed by stageApp.js -->
      </section>

      <!-- TEAM GWEN SPIDER -->
      <section class="spider-box gwen">
        <div style="text-align: center; margin-bottom: 8px;">
          <h2 class="chromatic-text" style="font-size: 24px; color: var(--gwen-pink); margin-bottom: 4px;">
            TEAM GWEN
          </h2>
          <div style="display: flex; justify-content: space-around; font-size: 13px; color: #ccc; margin-bottom: 8px;">
            <span id="gwen-players-display">0 PLAYERS</span>
            <span id="gwen-score-display" style="font-family: var(--font-comic); font-size: 18px; color: #ffd700;">0 PTS</span>
          </div>
          <div class="progress-bar-track" style="height: 10px;">
            <div id="gwen-stage-bar" class="progress-bar-fill" style="background: var(--gwen-pink); width: 0%;"></div>
          </div>
          <div id="gwen-pct-display" style="font-family: var(--font-comic); font-size: 18px; color: var(--gwen-pink); margin-top: 4px;">
            0%
          </div>
        </div>

        <div style="flex: 1; position: relative;">
          <canvas id="stage-canvas-gwen" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/stageApp.js"></script>
</body>
</html>
