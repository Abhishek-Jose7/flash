<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="glow-peter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Upside down Web Filament -->
  <path d="M 80 0 L 80 45" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

  <!-- Classic Mask -->
  <ellipse cx="80" cy="75" rx="35" ry="32" fill="#d91a2a" stroke="#0e1a38" stroke-width="3" filter="url(#glow-peter)"/>
  
  <!-- Classic Black Web Pattern -->
  <path d="M 80 44 L 80 106" stroke="#000000" stroke-width="1.3" opacity="0.6"/>
  <path d="M 48 75 Q 80 84 112 75" stroke="#000000" stroke-width="1.3" fill="none" opacity="0.6"/>
  <path d="M 52 58 Q 80 68 108 58" stroke="#000000" stroke-width="1.3" fill="none" opacity="0.6"/>
  <path d="M 54 92 Q 80 82 106 92" stroke="#000000" stroke-width="1.3" fill="none" opacity="0.6"/>

  <!-- Big Comic Spidey Eyes -->
  <polygon points="56,64 74,76 56,82" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <polygon points="104,64 86,76 104,82" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>

  <!-- Chibi Torso (Red & Blue) -->
  <path d="M 64 106 Q 80 102 96 106 L 104 138 Q 80 144 56 138 Z" fill="#1352b2" stroke="#000000" stroke-width="2.5"/>
  <path d="M 72 106 L 72 138 L 88 138 L 88 106 Z" fill="#d91a2a"/>
  <!-- Spider chest emblem -->
  <ellipse cx="80" cy="118" rx="3" ry="5" fill="#000000"/>
  <path d="M 80 116 L 73 111 M 80 116 L 87 111 M 80 120 L 73 126 M 80 120 L 87 126" stroke="#000000" stroke-width="1.8"/>

  <!-- Gloves & Web Burst -->
  <circle cx="50" cy="120" r="7" fill="#d91a2a" stroke="#000000" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="7" fill="#d91a2a" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="68" cy="144" rx="10" ry="6" fill="#d91a2a" stroke="#000000" stroke-width="1.5"/>
  <ellipse cx="92" cy="144" rx="10" ry="6" fill="#d91a2a" stroke="#000000" stroke-width="1.5"/>
</svg>
