<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="glow-gwen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff007f" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Web Line -->
  <path d="M 80 0 L 80 35" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Gwen's Iconic White Hoodie -->
  <path d="M 40 65 Q 40 25 80 25 Q 120 25 120 65 Q 120 95 80 102 Q 40 95 40 65 Z" fill="#f5f8fc" stroke="#00e5ff" stroke-width="3" filter="url(#glow-gwen)"/>
  
  <!-- Interior Teal Web Lining of Hood -->
  <path d="M 46 65 Q 52 40 80 38 Q 108 40 114 65 Q 108 85 80 92 Q 52 85 46 65 Z" fill="#120c1d" stroke="#ff007f" stroke-width="2"/>
  <path d="M 80 38 L 80 92" stroke="#ff007f" stroke-width="1.2" opacity="0.6"/>
  <path d="M 52 55 Q 80 62 108 55" stroke="#ff007f" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 54 75 Q 80 70 106 75" stroke="#ff007f" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Big Stylized Gwen Eyes (Teal with Pink Eyeliner) -->
  <!-- Left Eye -->
  <polygon points="56,54 72,67 56,71" fill="#00e5ff" stroke="#ff007f" stroke-width="2.5"/>
  <polygon points="58,56 70,66 58,69" fill="#ffffff" opacity="0.8"/>
  <!-- Right Eye -->
  <polygon points="104,54 88,67 104,71" fill="#00e5ff" stroke="#ff007f" stroke-width="2.5"/>
  <polygon points="102,56 90,66 102,69" fill="#ffffff" opacity="0.8"/>

  <!-- Chibi Gwen Body (Black Suit with Pink/Teal Web Torso) -->
  <path d="M 62 100 Q 80 96 98 100 L 106 136 Q 80 142 54 136 Z" fill="#140e22" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Pink Web Diamonds on Torso -->
  <polygon points="80,104 90,116 80,128 70,116" fill="none" stroke="#ff007f" stroke-width="2"/>

  <!-- Hands in Dynamic Web Leap -->
  <circle cx="46" cy="116" r="8" fill="#f5f8fc" stroke="#ff007f" stroke-width="2"/>
  <circle cx="114" cy="116" r="8" fill="#f5f8fc" stroke="#ff007f" stroke-width="2"/>
  <path d="M 118 116 L 142 106" stroke="#00e5ff" stroke-width="2.5"/>
  <polygon points="140,104 146,108 141,113" fill="#00e5ff"/>

  <!-- Ballet/Sneakers (Teal-soled) -->
  <ellipse cx="66" cy="144" rx="11" ry="6" fill="#00e5ff" stroke="#ff007f" stroke-width="1.8"/>
  <ellipse cx="94" cy="144" rx="11" ry="6" fill="#00e5ff" stroke="#ff007f" stroke-width="1.8"/>
</svg>
